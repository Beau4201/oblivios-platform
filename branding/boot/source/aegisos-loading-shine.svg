<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800">
  <title>AegisOS boot loading texture</title>
  <desc>
    Repeating 384px loading pattern. GrapheneOS scrolls this texture at a
    fixed 240px/s, producing one recurrence every 1.6 seconds.
  </desc>
  <rect width="1920" height="800" fill="#121318"/>
  <rect x="0" y="764" width="1920" height="6" fill="#36373A"/>
  <g fill="#7783FF">
    <rect x="0" y="764" width="95" height="6" rx="3"/>
    <rect x="384" y="764" width="95" height="6" rx="3"/>
    <rect x="768" y="764" width="95" height="6" rx="3"/>
    <rect x="1152" y="764" width="95" height="6" rx="3"/>
    <rect x="1536" y="764" width="95" height="6" rx="3"/>
  </g>
</svg>
